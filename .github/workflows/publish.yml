# 推送 v* 标签时发布到 npm，例如：
#   npm version patch && git push --follow-tags
# 使用 npm 的 Trusted Publishing（OIDC），仓库里不需要保存 npm 令牌；
# 首次使用前要在 npmjs.com 的包设置里把本仓库和这个 workflow 登记为可信发布者。
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted Publishing 和来源证明（provenance）都需要 OIDC 令牌。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted Publishing 需要 npm 11.5.1 以上，Node 24 自带的版本满足要求。
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 检查标签与 package.json 版本一致
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 package.json 的版本 $version 不一致"
            exit 1
          fi
      # prepublishOnly 会先跑一遍 npm test。
      - run: npm publish --provenance --access public
