# 每次推送或提交 PR 时，在 Node.js 20 与 22 上运行全部测试。
# 测试不依赖任何第三方包，因此不需要安装依赖。
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
